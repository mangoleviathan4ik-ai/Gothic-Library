<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Библиотека Тёмных Свитков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --stone-black:#0a0908;
    --stone-dark:#161310;
    --stone-mid:#26211b;
    --iron:#3d3a35;
    --iron-light:#7a746a;
    --iron-shine:#b8b0a0;
    --parchment:#e9dcc3;
    --parchment-dark:#cdb98d;
    --blood:#5c1f1f;
    --blood-light:#7c2f2a;
    --gold:#a9812f;
    --gold-bright:#d9ac52;
    --ember:#e08a3c;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--stone-black);
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    overflow-x:hidden;
  }

  h1,h2,h3,.gothic{
    font-family:'Cinzel', serif;
    letter-spacing:0.04em;
  }

  /* ===================== ДВЕРИ ===================== */
  #gate{
    position:fixed;
    inset:0;
    z-index:100;
    perspective:2400px;
    background:radial-gradient(ellipse at center, #241b12 0%, #0a0908 70%);
  }

  #gate.hidden{
    display:none;
  }

  .gate-frame{
    position:absolute;
    inset:0;
    display:flex;
  }

  .door{
    position:relative;
    width:50%;
    height:100%;
    transform-style:preserve-3d;
    transition:transform 1.9s cubic-bezier(.7,0,.2,1);
    cursor:pointer;
  }

  .door.left{
    transform-origin:left center;
    background:
      repeating-linear-gradient(90deg, #2c2924 0px, #34302a 3px, #221f1b 6px),
      linear-gradient(180deg,#3a352e,#1a1712 90%);
    border-right:2px solid #0a0908;
  }
  .door.right{
    transform-origin:right center;
    background:
      repeating-linear-gradient(90deg, #2c2924 0px, #34302a 3px, #221f1b 6px),
      linear-gradient(180deg,#3a352e,#1a1712 90%);
  }

  #gate.open .door.left{ transform:rotateY(-112deg); }
  #gate.open .door.right{ transform:rotateY(112deg); }

  .door-inner-border{
    position:absolute;
    inset:18px;
    border:6px solid var(--iron);
    box-shadow:
      inset 0 0 0 2px #050403,
      inset 0 0 30px rgba(0,0,0,.6);
  }
  .door-inner-border::before{
    content:"";
    position:absolute;
    inset:22px;
    border:2px solid var(--iron-light);
    opacity:.5;
  }

  /* заклёпки */
  .rivets{
    position:absolute;
    inset:34px;
    pointer-events:none;
  }
  .rivet{
    position:absolute;
    width:14px;height:14px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--iron-shine), var(--iron) 55%, #100e0b 100%);
    box-shadow:0 2px 3px rgba(0,0,0,.7);
  }

  /* большое кольцо-ручка */
  .handle{
    position:absolute;
    top:50%;
    width:70px;height:70px;
    transform:translateY(-50%);
  }
  .door.left .handle{ right:40px; }
  .door.right .handle{ left:40px; }
  .handle svg{ width:100%; height:100%; filter:drop-shadow(0 3px 5px rgba(0,0,0,.8)); }

  /* эмблема по центру */
  .sigil{
    position:absolute;
    top:50%;
    width:130px;
    transform:translateY(-50%);
    opacity:.85;
  }
  .door.left .sigil{ right:-65px; }
  .door.right .sigil{ left:-65px; }

  .gate-title{
    position:absolute;
    top:14%;
    left:0; right:0;
    text-align:center;
    z-index:5;
    pointer-events:none;
  }
  .gate-title h1{
    font-family:'UnifrakturMaguntia', cursive;
    font-size:clamp(2.4rem, 6vw, 4.6rem);
    color:var(--gold-bright);
    text-shadow:0 0 18px rgba(217,172,82,.55), 0 4px 10px rgba(0,0,0,.8);
    margin:0;
  }
  .gate-title p{
    font-family:'Cinzel', serif;
    color:var(--parchment-dark);
    font-size:.95rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    margin-top:10px;
    animation:pulseGlow 2.4s ease-in-out infinite;
  }

  @keyframes pulseGlow{
    0%,100%{opacity:.55;}
    50%{opacity:1;}
  }

  .torch{
    position:absolute;
    bottom:10%;
    width:26px;
    z-index:6;
  }
  .torch.tl{ left:6%; }
  .torch.tr{ right:6%; }
  .flame{
    width:20px;height:34px;
    margin:0 auto;
    background:radial-gradient(ellipse at 50% 80%, var(--ember), #b5471a 60%, transparent 75%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    filter:blur(1px);
    animation:flicker 1.4s ease-in-out infinite;
    box-shadow:0 0 24px 8px rgba(224,138,60,.45);
  }
  @keyframes flicker{
    0%,100%{ transform:scaleY(1) scaleX(1) rotate(-1deg); opacity:.9;}
    30%{ transform:scaleY(1.12) scaleX(.9) rotate(2deg); opacity:1;}
    60%{ transform:scaleY(.92) scaleX(1.05) rotate(-2deg); opacity:.85;}
  }
  .sconce{
    width:26px;height:34px;
    background:linear-gradient(180deg,var(--iron-light),var(--iron));
    margin-top:4px;
    border-radius:2px 2px 6px 6px;
  }

  /* ===================== БИБЛИОТЕКА ===================== */
  #library{
    position:relative;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(169,129,47,.08), transparent 45%),
      radial-gradient(ellipse at 80% 10%, rgba(92,31,31,.12), transparent 50%),
      radial-gradient(ellipse at 90% 95%, rgba(70,95,130,.09), transparent 55%),
      linear-gradient(180deg, var(--stone-dark), var(--stone-black) 30%);
    padding-bottom:80px;
    opacity:0;
  }
  #library.show{
    animation:fadeInLib 1.6s ease forwards;
  }
  @keyframes fadeInLib{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  .lib-header{
    text-align:center;
    padding:70px 20px 40px;
    border-bottom:2px solid var(--iron);
    position:relative;
  }
  .lib-header::after{
    content:"❧";
    display:block;
    color:var(--gold);
    font-size:1.6rem;
    margin-top:14px;
  }
  .lib-header h2{
    font-size:clamp(1.8rem,4vw,2.8rem);
    color:var(--gold-bright);
    margin:0 0 12px;
    text-shadow:0 0 16px rgba(217,172,82,.3);
  }
  .lib-header p{
    color:var(--parchment-dark);
    font-style:italic;
    font-size:1.1rem;
    max-width:560px;
    margin:0 auto;
  }

  .shelf-wrap{
    max-width:1200px;
    margin:0 auto;
    padding:50px 30px 0;
  }

  .books-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px,1fr));
    gap:38px 28px;
  }

  .book{
    position:relative;
    height:290px;
    border-radius:4px 8px 8px 4px;
    cursor:pointer;
    box-shadow:
      -6px 0 0 rgba(0,0,0,.35),
      6px 10px 22px rgba(0,0,0,.55);
    transform:perspective(600px) rotateY(0deg);
    transition:transform .4s ease, box-shadow .4s ease;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:22px 14px;
    border:1px solid rgba(0,0,0,.4);
  }
  .book::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:10px;
    background:linear-gradient(90deg, rgba(0,0,0,.45), transparent);
  }
  .book::after{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(233,220,195,.25);
    pointer-events:none;
  }
  .book:hover{
    transform:perspective(600px) rotateY(-8deg) translateY(-6px);
    box-shadow:-6px 0 0 rgba(0,0,0,.35), 10px 18px 30px rgba(0,0,0,.65);
  }

  .book-title{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:1.05rem;
    color:var(--parchment);
    text-shadow:0 2px 3px rgba(0,0,0,.6);
    line-height:1.25;
  }
  .book-author{
    font-family:'EB Garamond', serif;
    font-style:italic;
    font-size:.85rem;
    color:rgba(233,220,195,.85);
  }
  .book-emblem{
    align-self:center;
    font-size:2.1rem;
    opacity:.9;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));
  }

  .book-spine-lines{
    position:absolute;
    top:14px; bottom:14px; left:26px; right:26px;
    background:repeating-linear-gradient(180deg, transparent 0 8px, rgba(0,0,0,.12) 8px 9px);
    pointer-events:none;
  }

  footer{
    text-align:center;
    color:var(--iron-light);
    font-size:.85rem;
    letter-spacing:.15em;
    text-transform:uppercase;
    padding:50px 20px 10px;
  }

  /* ===================== МОДАЛКА ===================== */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(5,4,3,.82);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
    padding:20px;
  }
  .overlay.active{
    opacity:1;
    pointer-events:auto;
  }

  .scroll-card{
    position:relative;
    max-width:520px;
    width:100%;
    background:
      linear-gradient(180deg, var(--parchment), var(--parchment-dark));
    color:#2a2115;
    border-radius:6px;
    padding:40px 36px 34px;
    box-shadow:0 20px 60px rgba(0,0,0,.7), inset 0 0 40px rgba(120,90,40,.25);
    border:1px solid #8a7143;
    transform:scale(.9) translateY(10px);
    transition:transform .35s ease;
  }
  .overlay.active .scroll-card{
    transform:scale(1) translateY(0);
  }
  .scroll-card::before{
    content:"";
    position:absolute;
    inset:10px;
    border:2px solid rgba(93,58,20,.4);
    pointer-events:none;
  }

  .modal-emblem{ font-size:2.4rem; text-align:center; margin-bottom:6px;}

  .modal-title{
    font-family:'Cinzel', serif;
    font-weight:900;
    font-size:1.5rem;
    text-align:center;
    color:var(--blood);
    margin:0 0 4px;
  }
  .modal-author{
    text-align:center;
    font-style:italic;
    color:#5c4a2b;
    margin-bottom:18px;
    font-size:1rem;
  }
  .modal-desc{
    font-size:1.08rem;
    line-height:1.65;
  }

  .close-seal{
    position:absolute;
    top:-18px;
    right:-14px;
    width:46px;height:46px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--blood-light), var(--blood) 60%, #2c0d0d 100%);
    color:var(--parchment);
    border:2px solid #2c0d0d;
    font-family:'Cinzel', serif;
    font-size:1.2rem;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.6);
  }
  .close-seal:hover{ filter:brightness(1.15); }

  @media (max-width:520px){
    .scroll-card{ padding:32px 22px 28px; }
    .book{ height:250px; }
  }

  /* ===================== ОКНО С ДОЖДЁМ ===================== */
  .rain-window{
    position:fixed;
    bottom:26px;
    right:26px;
    width:190px;
    height:260px;
    z-index:50;
    border-radius:95px 95px 6px 6px;
    padding:13px;
    background:
      repeating-linear-gradient(90deg,#463d31 0 4px,#3a3227 4px 8px),
      linear-gradient(160deg,#4a4238,#221d17 70%);
    box-shadow:0 14px 34px rgba(0,0,0,.65), inset 0 0 0 4px #17130f;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.6s ease .3s;
  }
  .rain-window.show{ opacity:1; }

  .rain-window .glass{
    position:relative;
    width:100%;
    height:100%;
    border-radius:82px 82px 4px 4px;
    overflow:hidden;
    background:linear-gradient(195deg,#151d28 0%,#0a0e14 55%,#05070a 100%);
    box-shadow:inset 0 0 34px rgba(0,0,0,.85), inset 0 0 0 3px #0c0a08;
  }
  .rain-window .sky-glow{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 28% 15%, rgba(130,150,180,.16), transparent 55%);
    z-index:1;
  }
  .rain-window .glass::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(0deg, rgba(224,138,60,.16), transparent 42%);
    pointer-events:none;
    z-index:2;
  }
  .drops{
    position:absolute; inset:0;
    overflow:hidden;
    z-index:2;
  }
  .drop{
    position:absolute;
    top:-40px;
    width:2px;
    border-radius:2px;
    background:linear-gradient(180deg, transparent, rgba(196,214,238,.8));
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes fall{
    to{ transform:translateY(340px); }
  }
  .lightning{
    position:absolute; inset:0;
    background:#e3ebff;
    opacity:0;
    z-index:3;
  }
  .lightning.flash{ animation:flashLight .45s ease-out; }
  @keyframes flashLight{
    0%{opacity:.85;} 15%{opacity:.12;} 30%{opacity:.6;} 100%{opacity:0;}
  }

  .mullion-v{
    position:absolute; top:13px; bottom:13px; left:50%; width:6px;
    background:#1c1712; transform:translateX(-50%); z-index:4;
  }
  .mullion-h{
    position:absolute; left:13px; right:13px; top:50%; height:6px;
    background:#1c1712; transform:translateY(-50%); z-index:4;
  }

  .page-flash{
    position:fixed; inset:0;
    background:#dbe6ff;
    opacity:0;
    pointer-events:none;
    z-index:150;
  }
  .page-flash.flash{ animation:pageFlash .5s ease-out; }
  @keyframes pageFlash{
    0%{opacity:.3;} 20%{opacity:.04;} 40%{opacity:.18;} 100%{opacity:0;}
  }

  @media (max-width:720px){
    .rain-window{ width:118px; height:170px; bottom:14px; right:14px; border-radius:58px 58px 6px 6px; padding:9px;}
    .rain-window .glass{ border-radius:49px 49px 4px 4px;}
  }

  @media (prefers-reduced-motion: reduce){
    .door, .flame, .gate-title p, #library.show, .drop, .lightning.flash, .page-flash.flash{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<!-- ===================== ДВЕРИ ===================== -->
<div id="gate">
  <div class="gate-title">
    <h1>Библиотека Тёмных Свитков</h1>
    <p>Толкните врата</p>
  </div>

  <div class="torch tl"><div class="flame"></div><div class="sconce"></div></div>
  <div class="torch tr"><div class="flame"></div><div class="sconce"></div></div>

  <div class="gate-frame" id="gateFrame">
    <div class="door left" id="doorLeft">
      <div class="door-inner-border"></div>
      <div class="rivets" id="rivetsLeft"></div>
      <div class="handle">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="#8a8073" stroke-width="9"/><circle cx="50" cy="50" r="34" fill="none" stroke="#241f1a" stroke-width="3"/></svg>
      </div>
      <div class="sigil">
        <svg viewBox="0 0 100 100"><path d="M50 8 L58 40 L92 40 L64 58 L74 92 L50 70 L26 92 L36 58 L8 40 L42 40 Z" fill="#a9812f" opacity="0.5"/></svg>
      </div>
    </div>
    <div class="door right" id="doorRight">
      <div class="door-inner-border"></div>
      <div class="rivets" id="rivetsRight"></div>
      <div class="handle">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="#8a8073" stroke-width="9"/><circle cx="50" cy="50" r="34" fill="none" stroke="#241f1a" stroke-width="3"/></svg>
      </div>
      <div class="sigil">
        <svg viewBox="0 0 100 100"><path d="M50 8 L58 40 L92 40 L64 58 L74 92 L50 70 L26 92 L36 58 L8 40 L42 40 Z" fill="#a9812f" opacity="0.5"/></svg>
      </div>
    </div>
  </div>
</div>

<!-- ===================== БИБЛИОТЕКА ===================== -->
<div id="library">
  <div class="lib-header">
    <h2>Зал Избранных Томов</h2>
    <p>За окном шумит ночной дождь, а здесь, среди тёплого света свечей, ждут десять книг. Прикоснитесь к обложке, чтобы узнать её тайну.</p>
  </div>

  <div class="shelf-wrap">
    <div class="books-grid" id="booksGrid"></div>
  </div>

  <footer>Библиотека Тёмных Свитков · читай при свече</footer>
</div>

<!-- ===================== ОКНО С ДОЖДЁМ ===================== -->
<div class="rain-window" id="rainWindow">
  <div class="glass">
    <div class="sky-glow"></div>
    <div class="drops" id="drops"></div>
    <div class="lightning" id="windowLightning"></div>
  </div>
  <div class="mullion-v"></div>
  <div class="mullion-h"></div>
</div>
<div class="page-flash" id="pageFlash"></div>

<!-- ===================== МОДАЛКА ===================== -->
<div class="overlay" id="overlay">
  <div class="scroll-card">
    <button class="close-seal" id="closeModal">×</button>
    <div class="modal-emblem" id="modalEmblem"></div>
    <h3 class="modal-title" id="modalTitle"></h3>
    <div class="modal-author" id="modalAuthor"></div>
    <div class="modal-desc" id="modalDesc"></div>
  </div>
</div>

<script>
  // ---------- заклёпки на дверях ----------
  function buildRivets(container){
    const positions = [
      [8,8],[50,8],[92,8],
      [8,30],[92,30],
      [8,50],[92,50],
      [8,70],[92,70],
      [8,92],[50,92],[92,92]
    ];
    positions.forEach(([x,y])=>{
      const r = document.createElement('div');
      r.className = 'rivet';
      r.style.left = x+'%';
      r.style.top = y+'%';
      r.style.transform = 'translate(-50%,-50%)';
      container.appendChild(r);
    });
  }
  buildRivets(document.getElementById('rivetsLeft'));
  buildRivets(document.getElementById('rivetsRight'));

  // ---------- открытие врат ----------
  const gate = document.getElementById('gate');
  const library = document.getElementById('library');
  let opened = false;

  function openGate(){
    if(opened) return;
    opened = true;
    gate.classList.add('open');
    library.classList.add('show');
    document.getElementById('rainWindow').classList.add('show');
    setTimeout(()=>{
      gate.classList.add('hidden');
    }, 1950);
  }

  document.getElementById('doorLeft').addEventListener('click', openGate);
  document.getElementById('doorRight').addEventListener('click', openGate);

  // ---------- книги ----------
  const books = [
    {
      title:"Локвуд и Компания",
      author:"Джонатан Страуд",
      emblem:"🗡️",
      desc:"Лондон наводнён призраками, и бороться с ними могут только дети — их чувства к сверхъестественному острее взрослых. Люси Карлайл поступает в маленькое агентство Локвуда, где вместе с харизматичным Энтони Локвудом и ироничным Джорджем они берутся за самые опасные дела, вооружившись рапирами, солью и железными опилками."
    },
    {
      title:"Школа Добра и Зла",
      author:"Соман Чайнани",
      emblem:"⚔️",
      desc:"Каждые несколько лет из деревни Гавалдон бесследно исчезают двое детей, чтобы попасть в таинственную Школу Добра и Зла. Софи мечтает стать принцессой, а Агата уверена, что годится лишь в злодейки — но судьба переворачивает их ожидания, распределяя девочек в противоположные башни."
    },
    {
      title:"Ты — угроза А-класса",
      author:"Данияр Сугралинов",
      emblem:"🎮",
      desc:"Мир внезапно превращается в подобие игры: у людей появляются уровни, характеристики и умения, а по улицам бродят монстры. Герою предстоит выживать по новым правилам реальности, стремительно набирая силу и постепенно осознавая, что сам он — угроза, которую боятся системы."
    },
    {
      title:"Легенда о Тёмном Эльфе",
      author:"Роберт Сальваторе",
      emblem:"🗡️",
      desc:"История происхождения Дриззта До'Урдена — тёмного эльфа, рождённого в жестоком подземном городе дроу, где правят предательство и культ Паучьей Королевы. Отвергая жестокость собственного народа, Дриззт выбирает путь чести, даже если это означает вечное изгнание."
    },
    {
      title:"Анимоксы",
      author:"Кристиан Хумберг, Тобиас Бахман",
      emblem:"🦉",
      desc:"Существуют звери, способные принимать облик людей, — анимоксы. Когда мир этих оборотней оказывается под угрозой, юным героям приходится вступить в тайное общество защитников и разгадать заговор, угрожающий стереть границу между человеком и зверем."
    },
    {
      title:"1984",
      author:"Джордж Оруэлл",
      emblem:"👁️",
      desc:"Тоталитарное государство Океания следит за каждым шагом и даже мыслью своих граждан через культ Старшего Брата. Уинстон Смит, сотрудник Министерства Правды, переписывающий историю по указке партии, решается на немыслимое — на собственные мысли и чувства."
    },
    {
      title:"Шестёрка Воронов",
      author:"Ли Бардуго",
      emblem:"🃏",
      desc:"В портовом городе Кеттердам собирается банда из шести изгоев — вор, стрелок, шпионка, снайпер и другие мастера своего опасного ремесла. Им предстоит невозможное ограбление, за которое никто в здравом уме не взялся бы, но награда стоит любого риска."
    },
    {
      title:"Часодеи",
      author:"Наталья Щерба",
      emblem:"⏳",
      desc:"Обычная девочка Василиса неожиданно узнаёт, что способна останавливать время, — а значит, принадлежит к древнему роду часодеев. Ей открывается скрытый мир волшебных часовых механизмов и городов, где ход времени можно замедлить, ускорить или повернуть вспять, но за каждый дар приходится платить."
    },
    {
      title:"Леворукие Книготорговцы Лондона",
      author:"Гарт Никс",
      emblem:"📖",
      desc:"В альтернативном Лондоне древний орден книготорговцев тайно охраняет границу между обыденным миром и миром мифов: левши сражаются с потусторонними существами, правши хранят знания. Когда девушка Сьюзен начинает искать своего таинственного отца, ей приходится довериться одному из этих загадочных книготорговцев."
    },
    {
      title:"Терра и Тайна Созвездий",
      author:"Мая Сара",
      emblem:"✨",
      desc:"В мире, где магический дар получают все, рождённые под знаком своего созвездия, Терра остаётся единственной без всяких способностей — пока однажды в ней не пробуждается пугающая сила. Вместе с изгоем Греем, рождённым под опальным знаком Змееносца, она отправляется на поиски книги Зодиаков, чтобы раскрыть тайну своего происхождения."
    }
  ];

  const grid = document.getElementById('booksGrid');
  const palette = ['#4a2224','#233b2e','#2c2440','#3a2a17','#1f2f3d','#3d1f1f','#2a2a2a','#1f3d3a','#402a1f','#33264a'];

  books.forEach((b, i)=>{
    const card = document.createElement('div');
    card.className = 'book';
    card.style.background = `linear-gradient(160deg, ${palette[i % palette.length]}, #100d0a)`;
    card.innerHTML = `
      <div class="book-spine-lines"></div>
      <div>
        <div class="book-title">${b.title}</div>
        <div class="book-author">${b.author}</div>
      </div>
      <div class="book-emblem">${b.emblem}</div>
    `;
    card.addEventListener('click', ()=> openModal(b));
    grid.appendChild(card);
  });

  // ---------- модалка ----------
  const overlay = document.getElementById('overlay');
  function openModal(b){
    document.getElementById('modalEmblem').textContent = b.emblem;
    document.getElementById('modalTitle').textContent = b.title;
    document.getElementById('modalAuthor').textContent = b.author;
    document.getElementById('modalDesc').textContent = b.desc;
    overlay.classList.add('active');
  }
  function closeModal(){
    overlay.classList.remove('active');
  }
  document.getElementById('closeModal').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e)=>{
    if(e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') closeModal();
  });

  // ---------- дождь за окном ----------
  const dropsContainer = document.getElementById('drops');
  function spawnDrops(count){
    for(let i=0;i<count;i++){
      const d = document.createElement('div');
      d.className = 'drop';
      const left = Math.random()*100;
      const height = 14 + Math.random()*22;
      const duration = 0.55 + Math.random()*0.85;
      const delay = Math.random()*2.5;
      d.style.left = left+'%';
      d.style.height = height+'px';
      d.style.animationDuration = duration+'s';
      d.style.animationDelay = delay+'s';
      d.style.opacity = (0.35 + Math.random()*0.5).toFixed(2);
      dropsContainer.appendChild(d);
    }
  }
  spawnDrops(45);

  // ---------- молния ----------
  function lightningStrike(){
    const wLight = document.getElementById('windowLightning');
    const pFlash = document.getElementById('pageFlash');
    wLight.classList.remove('flash');
    void wLight.offsetWidth;
    wLight.classList.add('flash');
    if(Math.random() < 0.45){
      pFlash.classList.remove('flash');
      void pFlash.offsetWidth;
      pFlash.classList.add('flash');
    }
    setTimeout(lightningStrike, 5000 + Math.random()*9000);
  }
  setTimeout(lightningStrike, 4000);
</script>

</body>
</html>
